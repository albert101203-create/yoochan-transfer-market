name: Transfer market collector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "cache/**"
      - "asset-map.json"
      - "asset-attributions.json"
      - "assets/**"
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: transfer-market-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # A feed/API outage is recoverable; keep the last good cache online and
    # avoid turning a temporary outage into a failure-notification storm.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect and cache transfer data
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if node cloud-collector.js; then
              exit 0
            fi
            echo "Collector attempt $attempt failed; retrying..."
            sleep 10
          done
          exit 1

      - name: Validate card names and images
        if: always()
        continue-on-error: true
        run: node validate-assets.js

      - name: Commit updated cache
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "cache/*.json" "asset-map.json" "asset-attributions.json" "assets/players/*" "assets/clubs/*"
          git diff --cached --quiet || git commit -m "chore: refresh transfer market cache"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git reset --soft origin/main
            git add "cache/*.json" "asset-map.json" "asset-attributions.json" "assets/players/*" "assets/clubs/*"
            git diff --cached --quiet || git commit -m "chore: refresh transfer market cache"
          done
          exit 1
